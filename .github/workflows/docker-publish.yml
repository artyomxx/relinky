name: Publish Docker image

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'One-off GHCR tag for testing (e.g. ci-easy-deploy). Use from feature branches; does not move dev/latest/stable.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.publish_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag != '' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=raw,value=stable,enable=${{ (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=raw,value=release,enable=${{ github.ref == 'refs/heads/release' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=semver,pattern={{version}},enable=${{ github.event_name != 'workflow_dispatch' || inputs.publish_tag == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'workflow_dispatch' || inputs.publish_tag == '' }}
            type=semver,pattern={{major}},enable=${{ github.event_name != 'workflow_dispatch' || inputs.publish_tag == '' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=sha,prefix=release-,enable=${{ github.ref == 'refs/heads/release' && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}
            type=sha,prefix=,enable=${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish_tag == '') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
